services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: karyadrishti
      POSTGRES_USER: kd
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-kd_dev_only}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kd -d karyadrishti"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: "postgresql+psycopg://kd:${POSTGRES_PASSWORD:-kd_dev_only}@db:5432/karyadrishti"
      JWT_SECRET: "${JWT_SECRET:-replace-this-secret}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data: